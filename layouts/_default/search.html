{{ define "main" }}
<main>
  <article class="search-page">
    <div class="title">
      <h1 class="title">{{ .Title }}</h1>
    </div>

    {{ with .Content }}
    <section class="body search-intro">
      {{ . }}
    </section>
    {{ end }}

    <section
      class="search-panel"
      data-search-root
      {{ with .OutputFormats.Get "json" }}data-search-index-url="{{ .RelPermalink }}"{{ end }}>
      <label class="search-label" for="search-query">{{ i18n "search" }}</label>
      <input
        id="search-query"
        class="search-input"
        data-search-input
        type="search"
        name="q"
        autocomplete="off"
        spellcheck="false"
        aria-controls="search-results"
        aria-describedby="search-help search-status"
        placeholder="{{ i18n "placeholder" }}">
      <p id="search-help" class="search-hint">
        {{ if eq .Language.Lang "en" }}Press <kbd>/</kbd> to start searching.{{ else }}按 <kbd>/</kbd> 可以快速开始搜索。{{ end }}
      </p>
      <p id="search-status" class="search-status" data-search-status aria-live="polite">
        {{ i18n "loading" }}
      </p>
      <ul id="search-results" class="search-results" data-search-results></ul>
    </section>

    <noscript>
      <p class="search-status search-status-error">{{ i18n "nojs" }}</p>
    </noscript>
  </article>
</main>
<script defer src="{{ absURL "js/search.js" }}"></script>
{{ end }}
